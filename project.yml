name: AgentCaller
options:
  bundleIdPrefix: com.chirag
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 12
    MARKETING_VERSION: 0.1.0
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "147.0.0"
targets:
  AgentCaller:
    type: application
    platform: iOS
    sources:
      - path: ios/AgentCaller
    info:
      path: ios/AgentCaller/Info.plist
      properties:
        CFBundleDisplayName: Caller
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CallerRelayURL: https://agentcall-relay.chiragmgg.workers.dev
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Caller may use the camera for video during a live call and will always ask first.
        NSMicrophoneUsageDescription: Caller uses the microphone only during a live conversation with your agent.
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - voip
          - remote-notification
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.chirag.agentcaller
        DEVELOPMENT_TEAM: UF4L3PL7UG
        CODE_SIGN_ENTITLEMENTS: ios/AgentCaller/AgentCaller.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - AgentCallerTests
    dependencies:
      - package: WebRTC
        product: WebRTC
  AgentCallerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/AgentCallerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AgentCaller
